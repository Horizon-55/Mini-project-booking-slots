apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: booking-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Horizon-55/Mini-project-booking-slots.git
    targetRevision: main
    path: charts/booking-app
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: workspace-booking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
