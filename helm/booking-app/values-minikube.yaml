# Values for Minikube GitOps environment (DevOps Lab 6: Argo Rollouts)
replicaCount: 4

image:
  repository: ghcr.io/horizon-55/mini-project-booking-slots
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# Стратегія Progressive Delivery (ЛР-6)
rollout:
  enabled: true
  canary:
    steps:
      - setWeight: 25
      - pause: { duration: 15s }
      - setWeight: 50
      - pause: {} # Ручна пауза для верифікації та promote
      - setWeight: 75
      - pause: { duration: 15s }

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080

ingress:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

config:
  nodeEnv: "production"
  appVersion: "1.0.0"
  latencyDelayMs: "0"

postgres:
  persistence:
    enabled: false
