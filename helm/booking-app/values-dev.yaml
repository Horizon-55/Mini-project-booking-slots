# Values for DEVELOPMENT environment
replicaCount: 1

image:
  tag: "1.0.0-dev"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080

ingress:
  enabled: false

resources:
  limits:
    cpu: 150m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

config:
  nodeEnv: "development"
  latencyDelayMs: "0"

postgres:
  persistence:
    enabled: false # Для швидкого локального тестування без прив'язки до диска
