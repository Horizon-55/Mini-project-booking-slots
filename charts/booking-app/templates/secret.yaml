apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking-app.fullname" . }}-secret
  labels:
    {{- include "booking-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.secrets.dbUser }}:{{ .Values.secrets.dbPassword }}@{{ include "booking-app.postgresFullname" . }}:{{ .Values.config.dbPort }}/{{ .Values.config.dbName }}"
  REDIS_URL: "redis://{{ include "booking-app.redisFullname" . }}:{{ .Values.config.redisPort }}"
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
