{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "booking-app.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "booking-app.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  booking-app-dashboard.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Application Metrics (HTTP Traffic & Errors)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 20, "lineWidth": 2 },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "id": 1,
          "title": "Requests Per Second (RPS)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{route!~'.*metrics.*|.*health.*'}[1m])) by (route, method)",
              "legendFormat": "{{`{{method}} {{route}}`}}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 25, "lineWidth": 2 },
              "unit": "percent",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "id": 2,
          "title": "HTTP 5xx Error Rate (%)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{status=~'5..', route!~'.*metrics.*|.*health.*'}[1m])) or vector(0)) / (sum(rate(http_requests_total{route!~'.*metrics.*|.*health.*'}[1m])) > 0) * 100",
              "legendFormat": "5xx Error Rate %"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 15, "lineWidth": 2 },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "id": 3,
          "title": "Latency p95 (Seconds)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{route!~'.*metrics.*|.*health.*'}[1m])) by (le))",
              "legendFormat": "p95 Duration"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "id": 200,
          "title": "Kubernetes Resource Usage (cAdvisor)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 20, "lineWidth": 2 },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "id": 4,
          "title": "CPU Usage per Pod (Cores)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace='{{ .Release.Namespace }}', container='booking-app'}[1m])) by (pod)",
              "legendFormat": "{{`{{pod}}`}}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 20, "lineWidth": 2 },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "id": 5,
          "title": "Memory Usage per Pod",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace='{{ .Release.Namespace }}', container='booking-app'}) by (pod)",
              "legendFormat": "{{`{{pod}}`}}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "id": 300,
          "title": "Application Logs (Loki / Alloy)",
          "type": "row"
        },
        {
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 19 },
          "id": 6,
          "title": "Live Container Logs (Filtered by namespace and app)",
          "type": "logs",
          "options": {
            "showLabels": true,
            "wrapLogMessage": true,
            "enableLogDetails": true
          },
          "targets": [
            {
              "expr": "{namespace=\"{{ .Release.Namespace }}\"} |= \"HTTP\"",
              "legendFormat": ""
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["devops", "booking-app", "lab7"],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "title": "Booking Application - Observability (Lab 7)",
      "uid": "booking-app-observability"
    }
{{- end }}
