# Default values for booking-app.
# This is a YAML-formatted file.
# Defaults correspond to DEVELOPMENT environment.

# Кількість реплік бекенд-сервісу (dev: 1, prod: 3)
replicaCount: 1

image:
  repository: booking-api
  pullPolicy: IfNotPresent
  tag: "1.0.0"

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: booking.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Liveness та Readiness проби налаштовані на наш /health ендпоінт
probes:
  liveness:
    path: /api/health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 5

# Конфігурація застосунку (ConfigMap)
config:
  port: "3000"
  dbPort: "5432"
  dbName: "workspace_db"
  redisPort: "6379"
  nodeEnv: "development"
  appVersion: "1.0.0"
  latencyDelayMs: "0"
  failRate: "0"

# Секретні дані (Secrets). Увага: реальні продакшн паролі не комітяться у відкритому вигляді
secrets:
  dbUser: "user"
  dbPassword: "password"

# Сховище даних PostgreSQL
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# Кеш та координація Redis
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Моніторинг та аналітика (ЛР-7)
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 10s

dashboard:
  enabled: false

prometheusRule:
  enabled: false

analysis:
  enabled: false
  interval: 10s
  count: 3
  threshold: 0.95
  failureLimit: 1
  prometheusAddress: "http://kube-prometheus-stack-prometheus.monitoring:9090"

