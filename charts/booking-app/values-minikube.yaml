# Values for Minikube GitOps environment (DevOps Lab 6: Argo Rollouts & Lab 7: Observability)
replicaCount: 4

image:
  repository: ghcr.io/horizon-55/mini-project-booking-slots
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# Стратегія Progressive Delivery (ЛР-6 Canary з ручною паузою та ЛР-7 Prometheus Analysis)
rollout:
  enabled: true
  canary:
    steps:
      - setWeight: 25
      - pause: { duration: 15s }
      - analysis:
          templates:
            - templateName: booking-app-success-rate
      - setWeight: 50
      - pause: {} # РУЧНА ПАУЗА: зупинка для верифікації та виконання ручного promote (ЛР-6 п. 3.a)
      - setWeight: 75
      - pause: { duration: 15s }
      - analysis:
          templates:
            - templateName: booking-app-success-rate

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Надійні таймаути для захисту від передчасного SIGKILL Kubelet під навантаженням
probes:
  liveness:
    path: /api/health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 5

config:
  nodeEnv: "production"
  appVersion: "1.0.0"
  latencyDelayMs: "0"
  failRate: "0"

# Моніторинг та аналітика (ЛР-7)
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 10s

dashboard:
  enabled: true

prometheusRule:
  enabled: true

analysis:
  enabled: true
  interval: 10s
  count: 3
  threshold: 0.95
  failureLimit: 1
  prometheusAddress: "http://kube-prometheus-stack-prometheus.monitoring:9090"

postgres:
  persistence:
    enabled: false
