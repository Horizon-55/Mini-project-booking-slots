# Values for Minikube GitOps environment (DevOps Lab 7: Observability & Automated Canary Rollout)
replicaCount: 4

image:
  repository: ghcr.io/horizon-55/mini-project-booking-slots
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# Стратегія Progressive Delivery з автоматичним аналізом за метриками Prometheus (ЛР-7)
rollout:
  enabled: true
  canary:
    steps:
      - setWeight: 25
      - pause: { duration: 10s }
      - analysis:
          templates:
            - templateName: booking-app-success-rate
      - setWeight: 50
      - pause: { duration: 10s }
      - analysis:
          templates:
            - templateName: booking-app-success-rate
      - setWeight: 100

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080

ingress:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

config:
  nodeEnv: "production"
  appVersion: "1.0.0"
  latencyDelayMs: "0"
  failRate: "0"

# Моніторинг та аналітика (ЛР-7)
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 10s

dashboard:
  enabled: true

prometheusRule:
  enabled: true

analysis:
  enabled: true
  interval: 10s
  count: 3
  threshold: 0.95
  failureLimit: 1
  prometheusAddress: "http://kube-prometheus-stack-prometheus.monitoring:9090"

postgres:
  persistence:
    enabled: false
