events { 
    worker_connections 1024; 
}

http {
    # Upstream pool із алгоритмом Least Connections (ЛР3 п. 2.3.2)
    upstream backend_api {
        least_conn; # Направляє запит до вузла з найменшою кількістю активних з'єднань

        server api1:3000 max_fails=2 fail_timeout=5s;
        server api2:3000 max_fails=2 fail_timeout=5s;
        server api3:3000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_pass_header X-Instance-ID;
            proxy_pass_header X-Cache;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
    }
}
