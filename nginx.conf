events { 
    worker_connections 1024; 
}

http {
    # Upstream pool бекенд-екземплярів (ЛР3 п. 2.1, 2.3)
    upstream backend_api {
        # --- Алгоритми балансування навантаження ---
        # 1. Round Robin (за замовчуванням, якщо не вказано інший алгоритм)
        # 2. Least Connections: розкоментуйте рядок нижче
        # least_conn;
        # 3. IP Hash: розкоментуйте рядок нижче
        # ip_hash;

        # Пасивний Health Checking (п. 2.4.2):
        # max_fails=2: після 2 послідовних збоїв нода вважається непрацездатною
        # fail_timeout=5s: тайм-аут блокування ноди перед повторною спробою
        server api1:3000 max_fails=2 fail_timeout=5s;
        server api2:3000 max_fails=2 fail_timeout=5s;
        server api3:3000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Прокидаємо заголовок X-Instance-ID клієнту для верифікації розподілу
            proxy_pass_header X-Instance-ID;
            # Прокидаємо заголовок X-Cache клієнту для верифікації розподіленого кешу (ЛР4 п. 2.6)
            proxy_pass_header X-Cache;

            # --- Механізми Fault Tolerance (ЛР3 п. 2.4.3) ---
            # Якщо інстанс повертає помилку з'єднання, таймаут або 5xx,
            # Nginx МИТТЄВО перенаправляє запит на інший працездатний вузол.
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            # Таймаути для швидкого виявлення відмов
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
    }
}